name: update

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.update.outputs.version }}
      changed: ${{ steps.update.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - id: update
        run: |
          ./update.sh
          echo "version=$(jq -r .version sources.json)" >> "$GITHUB_OUTPUT"
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.update.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sources
          path: sources.json

  build:
    needs: update
    if: needs.update.outputs.changed == 'true'
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: actions/download-artifact@v8
        with:
          name: sources
      - run: nix build -L .#packages.${{ matrix.system }}.pi

  push:
    needs:
      - update
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: sources
      - env:
          VERSION: ${{ needs.update.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "pi: v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD "refs/tags/v$VERSION"
