name: update

on:
  schedule:
    - cron: "41 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.update.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - id: update
        run: |
          for script in packages/*/update.sh; do
            "$script"
          done
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.update.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: packages

  build:
    needs: update
    if: needs.update.outputs.changed == 'true'
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages
      - run: nix build -L .#packages.${{ matrix.system }}.{pi,omp,dsh}

  push:
    needs:
      - update
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for dir in packages/*/; do
            name=$(basename "$dir")
            if ! git diff --quiet -- "$dir"; then
              git add "$dir"
              git commit -m "$name: v$(jq -r .version "$dir/sources.json")"
            fi
          done
          git push origin HEAD
